name: Rebuild SS.Coffee source archive

on:
  push:
    branches: [main]
    paths:
      - "source-parts/**"
      - ".github/workflows/rebuild-source-archive.yml"

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Reassemble and validate archive
        run: |
          cat source-parts/SS-Coffee-source.tar.gz.part* > SS-Coffee-source.tar.gz
          tar -tzf SS-Coffee-source.tar.gz >/dev/null
      - name: Commit complete archive
        run: |
          if ! git diff --quiet -- SS-Coffee-source.tar.gz; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add SS-Coffee-source.tar.gz
            git commit -m "Add complete SS.Coffee source archive"
            git push origin HEAD:main
          fi
